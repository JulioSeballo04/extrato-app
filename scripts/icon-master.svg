<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Fundo cheio: o sistema (Android/iOS) aplica o próprio arredondamento. -->
  <rect width="1024" height="1024" fill="#0F1115"/>
  <!-- Cartões: 420 x 262 (proporção de cartão real), cantos iguais. -->
  <g transform="translate(512 506)">
    <!-- Cartão de trás (claro) -->
    <g transform="translate(84 -40) rotate(14)">
      <rect x="-210" y="-131" width="420" height="262" rx="32" fill="#F3EADC"/>
      <rect x="-180" y="-82" width="360" height="40" rx="8" fill="#0F1115"/>
    </g>
    <!-- Cartão da frente (dourado) -->
    <g transform="translate(-74 36) rotate(-11)">
      <rect x="-210" y="-131" width="420" height="262" rx="32" fill="#E3B53B"/>
      <rect x="-180" y="-82" width="360" height="40" rx="8" fill="#0F1115"/>
      <rect x="-160" y="20" width="72" height="62" rx="12" fill="#0F1115"/>
    </g>
  </g>
</svg>
